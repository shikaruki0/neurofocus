<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Accent gradient: cyan to purple -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Brain outline gradient -->
    <linearGradient id="brainStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="50%" stop-color="#7c6ef7"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Ambient glow behind brain -->
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded rectangle in Midnight -->
  <rect width="512" height="512" rx="108" fill="#050810"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)"/>

  <!-- Brain icon: scaled up for better visibility -->
  <g filter="url(#glow)" transform="translate(256, 256) scale(1.5)">
    <!-- Left hemisphere -->
    <path d="M-12,-130 C-70,-130 -115,-105 -130,-65 C-145,-25 -140,15 -125,45 
             C-110,75 -85,100 -55,115 C-30,128 -15,128 -12,125"
          fill="none" stroke="url(#brainStroke)" stroke-width="6" stroke-linecap="round"/>
    <!-- Left folds -->
    <path d="M-20,-85 C-60,-75 -100,-50 -110,-15"
          fill="none" stroke="url(#brainStroke)" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M-25,-20 C-65,-5 -105,15 -105,50"
          fill="none" stroke="url(#brainStroke)" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M-15,40 C-50,55 -70,80 -55,105"
          fill="none" stroke="url(#brainStroke)" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>

    <!-- Right hemisphere -->
    <path d="M12,-130 C70,-130 115,-105 130,-65 C145,-25 140,15 125,45 
             C110,75 85,100 55,115 C30,128 15,128 12,125"
          fill="none" stroke="url(#brainStroke)" stroke-width="6" stroke-linecap="round"/>
    <!-- Right folds -->
    <path d="M20,-85 C60,-75 100,-50 110,-15"
          fill="none" stroke="url(#brainStroke)" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M25,-20 C65,-5 105,15 105,50"
          fill="none" stroke="url(#brainStroke)" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M15,40 C50,55 70,80 55,105"
          fill="none" stroke="url(#brainStroke)" stroke-width="4.5" stroke-linecap="round" opacity="0.65"/>

    <!-- Central divide -->
    <line x1="0" y1="-125" x2="0" y2="120" stroke="url(#brainStroke)" stroke-width="3.5" opacity="0.35"/>

    <!-- Neural nodes with glow -->
    <g filter="url(#nodeGlow)">
      <circle cx="-80" cy="-65" r="7" fill="#00d9ff"/>
      <circle cx="-65" cy="10" r="6" fill="#00d9ff"/>
      <circle cx="-50" cy="75" r="6.5" fill="#a855f7"/>
      <circle cx="80" cy="-65" r="7" fill="#00d9ff"/>
      <circle cx="65" cy="10" r="6" fill="#a855f7"/>
      <circle cx="50" cy="75" r="6.5" fill="#a855f7"/>
      <circle cx="0" cy="-100" r="7.5" fill="#00d9ff"/>
      <circle cx="0" cy="105" r="6" fill="#a855f7"/>
    </g>

    <!-- Neural connections -->
    <g stroke="url(#accentGrad)" stroke-width="2" opacity="0.25" stroke-linecap="round">
      <line x1="-80" y1="-65" x2="0" y2="-100"/>
      <line x1="80" y1="-65" x2="0" y2="-100"/>
      <line x1="-80" y1="-65" x2="-65" y2="10"/>
      <line x1="80" y1="-65" x2="65" y2="10"/>
      <line x1="-65" y1="10" x2="-50" y2="75"/>
      <line x1="65" y1="10" x2="50" y2="75"/>
      <line x1="-50" y1="75" x2="0" y2="105"/>
      <line x1="50" y1="75" x2="0" y2="105"/>
    </g>
  </g>
</svg>
